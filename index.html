<head>

<script>/* 先套主題，避免閃爍（設定由 App.setTheme 寫入 jpQuest.ui） */try{var u=JSON.parse(localStorage.getItem("jpQuest.ui")||"{}"),h=document.documentElement;if(u.theme==="light"||u.theme==="dark")h.setAttribute("data-theme",u.theme);h.setAttribute("data-palette",u.palette||"coral");if(u.fs&&u.fs!=="m")h.setAttribute("data-fs",u.fs);}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<!-- 其他 CSS 隨路由載入（Home.lazy 第 3 個參數） -->
</head>
<body>
<header id="top"><div class="in">
  <a class="logo" href="#home"><span class="lg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><circle cx="15" cy="20" r="6.5" style="fill:var(--pri)"/><circle cx="26" cy="11" r="6.5" style="fill:var(--pri)"/><circle cx="38" cy="11" r="6.5" style="fill:var(--pri)"/><circle cx="49" cy="20" r="6.5" style="fill:var(--pri)"/><path d="M32 24c-4 0-6 3-8.5 7.5L12 50c-2 4 0 8 5 8h30c5 0 7-4 5-8L40.5 31.5C38 27 36 24 32 24z" style="fill:var(--text)"/><path d="M32 24c-4 0-6 3-8.5 7.5l-3.2 5.3 4.2-2.6 3.5 3 4-3.4 4 3.4 3.5-3 4.2 2.6-3.2-5.3C38 27 36 24 32 24z" style="fill:var(--card)"/></svg></span><span class="t">日語冒險</span></a>
  <nav id="nav"></nav>
  <div id="playerChip"></div>
</div></header>
<main id="main"></main>

<!-- 同步載入：只有外殼（核心、學習進度、遊戲化、今天首頁）。其他全部進入路由時才載入 -->
<script src="js/core.js"></script>
<script src="js/learn.js"></script>
<script src="js/game.js"></script>
<script src="js/home.js"></script>
<script src="js/kana-guide.js"></script>
<script src="js/nav.js"></script>
<script>
// 延遲載入：Home.lazy([[路由, 外殼定義]…], [依序載入的 js…], [css…])；第一次進入才下載。導覽 4 鈕：home 今天 1、path 路線 2、lookup 查 3、me 我的 4
(function (L) {
  const K = ['kana-data.js'], SC = ['data/scenes-1.js', 'data/scenes-2.js', 'data/scene-ext.js'], PH = ['js/phrase.js'], LO = ['data/loan.js'];
  const TD = ['data/travel.js', 'data/travel-ext.js', 'data/travel-stops.js'];
  const r = (name, title, icon, o) => [name, Object.assign({ title, icon, nav: false }, o && o.nav ? {} : { navParent: 'home' }, o || {})];
  // 冒險世界（狀況題 event 另需舊旅程的 TravelData）
  const WD = PH.concat(LO, SC, ['data/world/index.js', 'js/world-art.js', 'js/world.js', 'js/world-quest.js']);
  L([r('play', '冒險地圖', '🗾', { navParent: 'path' })], WD, ['css/world.css']);
  L([r('event', '狀況題', '⚡', { navParent: 'path' })], WD.concat(TD), ['css/world.css']);
  // 第二階段：路線、活動、查、我的
  // 路線：js/classic.js 提供 PathExtra（旅遊包／五十音／日檢的「更多練習」、五十音表），須先於 path.js 載入
  L([r('path', '學習', '🧭', { nav: true, navOrder: 2 }), r('path-unit', '單元', '🧭', { navParent: 'path' })], ['js/classic.js', 'js/path.js'], ['css/path.css', 'css/kana.css']);
  L([r('kana-quiz', '假名測驗', '✏️', { navParent: 'path' })], K.concat(['js/kana-lesson.js', 'js/classic.js']), ['css/kana.css']);
  L([r('act', '練習', '▶', { navParent: 'path' })], PH.concat(['js/activity.js', 'js/activities/flashcard.js', 'js/activities/choice.js', 'js/activities/wordbank.js', 'js/activities/listen.js']), ['css/activity.css']);
  L([r('lookup', '查', '🔍', { nav: true, navOrder: 3 })], PH.concat(['js/phrasebook.js', 'js/lookup.js']), ['css/lookup.css']);
  L([r('me', '我的', '👤', { nav: true, navOrder: 4 })], ['js/me.js'], ['css/lookup.css']);
  // 複習、字卡
  L([r('review', '複習', '📌', { navParent: 'me' })], K.concat(SC, PH, ['js/review.js']));
  L([r('cards', '字卡', '🎴', { navParent: 'me' })], K.concat(SC, ['data/cards.js'], PH, LO, ['js/practice.js']), ['css/world.css']);
  // 手冊、特訓、挑戰
  L([r('phrasebook', '旅遊手冊', '📖', { navParent: 'lookup' })], SC.concat(PH, ['data/world/index.js', 'js/phrasebook.js']));
  L([r('boot', '聽力特訓', '🎧', { navParent: 'path' }), r('boot-play', '聽力特訓', '🎧', { navParent: 'path' })], SC.concat(['data/drills.js', 'js/drill.js']));
  L([r('challenge', '日檢挑戰', '🏆', { navParent: 'path' }), r('challenge-play', '日檢挑戰', '🏆', { navParent: 'path' })], ['data/mind/grammar.js', 'js/challenge.js'], ['css/challenge.css']);
  // 知識庫（kb、kb-page）；tree＝相依樹（文法先修、動詞變化來源；舊 mind3d 轉址）
  const MIND = ['data/mind/taxonomy.js', 'data/mind/conj.js', 'data/mind/grammar.js'];
  L([r('kb', '辭典', '📘', { navParent: 'lookup' }), r('kb-page', '辭典', '📘', { navParent: 'lookup' }), r('mind', '辭典', '📘', { navParent: 'lookup', transient: true })], PH.concat(LO, MIND, ['js/kb.js']), ['css/kb.css']);
  L([r('tree', '相依樹', '🌳', { navParent: 'lookup' }), r('mind3d', '相依樹', '🌳', { navParent: 'lookup', transient: true })], ['data/mind/conj.js', 'data/mind/grammar.js', 'js/mind-tree.js'], ['css/kb.css']);
  // 閱讀與歌曲（含商務短文 data/reading/biz.js）
  L([r('read', '文章・新聞', '📄', { navParent: 'lookup' }), r('read-article', '閱讀', '📄', { navParent: 'lookup' }),
    r('songs', '跟唱', '🎶', { navParent: 'lookup' }), r('song', '跟唱', '🎶', { navParent: 'lookup' })],
    PH.concat(LO, SC, ['data/reading/daily.js', 'data/reading/biz.js', 'js/jp-text.js', 'js/link-import.js', 'js/reader.js', 'js/songs.js']), ['css/reader.css']);
  // 商務日語（C）：css/biz.css 由 biz.js 自行插入
  L([r('biz', '商務日語', '💼', { navParent: 'path' }), r('biz-unit', '商務日語', '💼', { navParent: 'path' }), r('biz-read', '商務閱讀', '💼', { navParent: 'path' })],
    PH.concat(['data/biz/units-1.js', 'data/biz/units-2.js', 'data/biz/units-3.js', 'data/biz/units-4.js', 'data/reading/biz.js', 'js/biz.js']), ['css/biz.css']);
  // 場景包的練習（入口：js/classic.js 的 PathExtra）：情境任務 menu（practice.js）、對話／口說／單字測驗 drill（town.js）
  L([r('menu', '情境任務', '🧾', { navParent: 'path' }), r('drill', '對話', '🎭', { navParent: 'path' })], SC.concat(['data/cards.js', 'data/menus.js'], PH, LO, ['js/town.js', 'js/practice.js']), ['css/world.css']);
})(Home.lazy);
App.start();
try { if ('serviceWorker' in navigator && location.protocol.startsWith('http') && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { }
</script>
</body>
</html>
